    <script>
    /* =============================================
       FULL PRODUCT CATALOG (Centralized in js/products-data.js)
    ============================================= */

    /* =============================================
       LOOKUP + RELATED
    ============================================= */
    function getProductById(id) {
        for (var i = 0; i < PRODUCTS.length; i++) {
            if (PRODUCTS[i].id === id) return PRODUCTS[i];
        }
        return null;
    }

    function getRelated(product, count) {
        count = count || 4;
        var related = [];
        for (var i = 0; i < PRODUCTS.length; i++) {
            if (PRODUCTS[i].id !== product.id && PRODUCTS[i].category === product.category) {
                related.push(PRODUCTS[i]);
            }
            if (related.length >= count) break;
        }
        // Fill with other products if needed
        if (related.length < count) {
            for (var j = 0; j < PRODUCTS.length; j++) {
                if (PRODUCTS[j].id !== product.id && related.indexOf(PRODUCTS[j]) === -1) {
                    related.push(PRODUCTS[j]);
                }
                if (related.length >= count) break;
            }
        }
        return related;
    }

    /* =============================================
       RENDER DETAIL PAGE
    ============================================= */
    function renderDetail(product) {
        var mainImg = product.images[0];
        var catLabel = product.category.charAt(0).toUpperCase() + product.category.slice(1);

        // Banner + breadcrumb
        document.getElementById('detail-banner-title').textContent = product.name;
        document.getElementById('breadcrumb-product-name').textContent = product.name;
        document.title = product.name + ' | Wu Spa Charlotte NC';

        // Thumbnails
        var thumbsHTML = '';
        product.images.forEach(function (src, idx) {
            thumbsHTML += '<img src="' + src + '" alt="' + product.name + ' view ' + (idx+1) + '" ' +
                (idx === 0 ? 'class="active"' : '') +
                ' onclick="switchDetailImage(this, \'' + src + '\')"' +
                ' onerror="this.style.display=\'none\'">';
        });

        // Stars
        var stars = '<i class="fa fa-star"></i><i class="fa fa-star"></i><i class="fa fa-star"></i><i class="fa fa-star"></i><i class="fa fa-star-half-o"></i>';

        var html =
            '<div class="row">' +

            // LEFT: Image Gallery
            '<div class="col-lg-5 col-md-12 m-b30">' +
            '<img id="detail-main-image" src="' + mainImg + '" alt="' + product.name + '" class="product-detail-main-img" ' +
            'onerror="this.src=\'images/Products images/RetailHeroShots/RetailHero1.jpg\'">' +
            '<div class="product-thumb-strip">' + thumbsHTML + '</div>' +
            '</div>' +

            // RIGHT: Info
            '<div class="col-lg-7 col-md-12">' +
            '<div class="product-info-panel">' +
            '<span class="product-category-badge">' + catLabel + '</span>' +
            '<h2>' + product.name + '</h2>' +
            '<div class="rating-bx m-b5">' + stars + ' <span style="font-size:13px;color:#999;margin-left:5px;">(4.8 / 5.0)</span></div>' +
            '<div class="product-detail-price">$' + product.price.toFixed(2) + '</div>' +
            '<p class="product-detail-desc">' + product.description + '</p>' +

            '<table class="product-detail-specs-table">' +
            '<tr><td>Skin Type</td><td>' + product.skinType + '</td></tr>' +
            '<tr><td>Size</td><td>' + product.size + '</td></tr>' +
            '<tr><td>Category</td><td>' + catLabel + '</td></tr>' +
            '<tr><td>Stock</td><td><span style="color:#4caf50;"><i class="fa fa-check-circle"></i> In Stock</span></td></tr>' +
            '</table>' +

            '<div class="qty-control">' +
            '<label for="detail-qty">Qty:</label>' +
            '<input type="number" id="detail-qty" value="1" min="1" max="20">' +
            '</div>' +

            '<div class="detail-action-btns">' +
            '<button class="site-button" id="add-to-cart-btn" onclick="handleAddToCart(\'' + product.id + '\',\'' + product.name.replace(/'/g, "\\'") + '\',' + product.price + ',\'' + mainImg + '\')">' +
            '<i class="fa fa-cart-plus m-r5"></i> ADD TO CART' +
            '</button>' +
            '<a href="contact-1.html" class="site-button-secondry">' +
            '<i class="fa fa-phone m-r5"></i> CONSULT AN ESTHETICIAN' +
            '</a>' +
            '</div>' +

            '<p style="font-size:12px;color:#aaa;"><i class="fa fa-truck m-r5"></i>Free shipping on orders over $75 | <i class="fa fa-lock m-r5"></i>Secure checkout</p>' +
            '</div>' +
            '</div>' +
            '</div>' + // end row

            // TABS
            '<div class="row m-t40">' +
            '<div class="col-md-12">' +
            '<div class="product-tabs">' +
            '<ul class="nav nav-tabs" role="tablist">' +
            '<li class="active"><a href="#tab-description" data-toggle="tab">Description</a></li>' +
            '<li><a href="#tab-ingredients" data-toggle="tab">Ingredients & How To Use</a></li>' +
            '<li><a href="#tab-reviews" data-toggle="tab">Reviews (12)</a></li>' +
            '</ul>' +
            '<div class="tab-content product-tab-content">' +

            // Description tab
            '<div class="tab-pane active" id="tab-description">' +
            '<h4 class="m-b15">About ' + product.name + '</h4>' +
            '<p>' + product.description + '</p>' +
            '<h5 class="m-t20 m-b10">Key Benefits</h5>' +
            '<ul class="list-check secondry">' +
            product.benefits.split(',').map(function(b){ return '<li>' + b.trim() + '</li>'; }).join('') +
            '</ul>' +
            '</div>' +

            // Ingredients tab
            '<div class="tab-pane" id="tab-ingredients">' +
            '<div class="row">' +
            '<div class="col-md-6">' +
            '<h5 class="m-b10">Key Ingredients</h5>' +
            '<p>' + product.ingredients + '</p>' +
            '</div>' +
            '<div class="col-md-6">' +
            '<h5 class="m-b10">How To Use</h5>' +
            '<p>' + product.howToUse + '</p>' +
            '</div>' +
            '</div>' +
            '</div>' +

            // Reviews tab
            '<div class="tab-pane" id="tab-reviews">' +
            '<div class="m-b20">' +
            '<div class="bdr-1 bdr-gray p-a20 m-b15" style="border-radius:4px;">' +
            '<div class="rating-bx m-b5"><i class="fa fa-star"></i><i class="fa fa-star"></i><i class="fa fa-star"></i><i class="fa fa-star"></i><i class="fa fa-star"></i></div>' +
            '<p><strong>Sarah M.</strong> — <em style="color:#999;">Verified Purchase</em></p>' +
            '<p>"Absolutely love this product! After consistently using it for 3 weeks I noticed a significant improvement in my skin. My esthetician at Wu Spa recommended it and I\'m so glad she did!"</p>' +
            '</div>' +
            '<div class="bdr-1 bdr-gray p-a20 m-b15" style="border-radius:4px;">' +
            '<div class="rating-bx m-b5"><i class="fa fa-star"></i><i class="fa fa-star"></i><i class="fa fa-star"></i><i class="fa fa-star"></i><i class="fa fa-star-half-o"></i></div>' +
            '<p><strong>Jennifer R.</strong> — <em style="color:#999;">Verified Purchase</em></p>' +
            '<p>"Such a high quality product. I\'ve tried many similar ones but Skin Script is truly professional grade. You can feel the difference immediately. Highly recommend purchasing through Wu Spa."</p>' +
            '</div>' +
            '</div>' +
            '</div>' +

            '</div>' + // tab-content
            '</div>' + // product-tabs
            '</div>' +
            '</div>'; // end row

        document.getElementById('product-detail-content').innerHTML = html;
    }

    /* =============================================
       RENDER RELATED PRODUCTS
    ============================================= */
    function renderRelated(product) {
        var related = getRelated(product, 4);
        var html = '';
        related.forEach(function (p) {
            var imgSrc = (p.images && p.images[0]) || p.image || '';
            if (!imgSrc || imgSrc.slice(-1) === '/') imgSrc = 'images/Products images/RetailHeroShots/RetailHero1.jpg';
            html += '<div class="col-lg-3 col-md-6 col-sm-6 m-b20">' +
                '<div class="related-product-card">' +
                '<a href="product-detail.html?product=' + p.id + '">' +
                '<img class="rpc-img" src="' + imgSrc + '" alt="' + p.name + '" onerror="this.src=\'images/Products images/RetailHeroShots/RetailHero1.jpg\'">' +
                '</a>' +
                '<div class="rpc-info">' +
                '<h5><a href="product-detail.html?product=' + p.id + '">' + p.name + '</a></h5>' +
                '<div class="rpc-price">$' + p.price.toFixed(2) + '</div>' +
                '<button class="site-button btn-sm btn-block" onclick="WuSpaCart.addToCart(\'' + p.id + '\',\'' + p.name.replace(/'/g,"\\'") + '\',' + p.price + ',\'' + imgSrc + '\');">' +
                '<i class="fa fa-cart-plus m-r5"></i>Add to Cart' +
                '</button>' +
                '</div>' +
                '</div>' +
                '</div>';
        });
        document.getElementById('related-products-grid').innerHTML = html;
    }

    /* =============================================
       SWITCH ACTIVE THUMBNAIL
    ============================================= */
    function switchDetailImage(el, src) {
        document.getElementById('detail-main-image').src = src;
        document.querySelectorAll('.product-thumb-strip img').forEach(function (img) {
            img.classList.remove('active');
        });
        el.classList.add('active');
    }

    /* =============================================
       ADD TO CART (respects qty)
    ============================================= */
    function handleAddToCart(id, name, price, image) {
        var qtyEl = document.getElementById('detail-qty');
        var qty = qtyEl ? Math.max(1, parseInt(qtyEl.value) || 1) : 1;
        WuSpaCart.addToCart(id, name, price, image, qty);
    }

    /* =============================================
       PAGE INIT — READ URL PARAM
    ============================================= */
    (function init() {
        var params = new URLSearchParams(window.location.search);
        var productId = params.get('product');
        var product = productId ? getProductById(productId) : null;

        if (!product) {
            // Show not-found message
            document.getElementById('product-detail-content').innerHTML =
                '<div class="not-found-box">' +
                '<i class="fa fa-exclamation-circle fa-3x m-b20" style="color:#EC5598;opacity:0.5;"></i>' +
                '<h3>Product Not Found</h3>' +
                '<p>The product you\'re looking for doesn\'t exist or may have been moved.</p>' +
                '<a href="product.html" class="site-button m-t15"><i class="fa fa-arrow-left m-r5"></i> Back to All Products</a>' +
                '</div>';
            document.getElementById('related-products-grid').innerHTML = '';
            return;
        }

        renderDetail(product);
        renderRelated(product);
    })();
    </script>
